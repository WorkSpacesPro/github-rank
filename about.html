<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关于 - GitHub 开源排行榜</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body>

  <div id="app-header"></div>

  <div class="layout">
    <div id="app-sidebar"></div>

    <!-- 右侧主内容区：这里变成了关于页面的内容 -->
    <main class="main">
      <h1 class="page-title">关于本项目</h1>
      <div class="page-meta">最后更新：2026-11-11</div>
      
      <div class="about-content" style="line-height: 1.8; color: var(--text);">
        <p>这是一个基于 <strong>GitHub Actions</strong> 和 <strong>Cloudflare Pages</strong> 搭建的自动开源排行榜。</p>
        <br>
        <h3>为什么做这个？</h3>
        <p>为了快速追踪开源社区的流行趋势，所有数据每日自动抓取并更新。</p>
        <br>
        <h3>技术栈</h3>
        <ul style="padding-left: 20px; color: var(--text-muted);">
          <li>Python (数据抓取与快照对比)</li>
          <li>GitHub Actions (自动化定时任务)</li>
          <li>原生 HTML + CSS + JS (极简前端)</li>
        </ul>
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script src="assets/app.js"></script>
