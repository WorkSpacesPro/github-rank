<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub 开源排行榜</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body>

  <div id="app-header"></div>

  <div class="layout">
    <div id="app-sidebar"></div>

    <main class="main">
      <h1 class="page-title" data-i18n="pageTitle">GitHub 开源排行榜</h1>
      <div class="page-meta" id="update-time" data-i18n="loading">正在获取数据...</div>

      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search-input" placeholder="搜索项目名、语言或简介..." data-i18n-placeholder="searchPlaceholder">
      </div>

      <!-- 👇 标签区改造：增加了全部分类按钮 -->
      <div class="tabs-wrapper">
        <div class="tabs" id="tabs"></div>
        <button class="all-cats-btn" id="open-drawer-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span data-i18n="allCats">全部分类</span>
        </button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th class="col-rank">#</th>
              <th data-i18n="thProject">项目</th>
              <th class="col-stars sortable" data-key="stars">Stars</th>
              <th class="col-growth sortable" data-key="growth" data-i18n="thGrowth">涨星</th>
              <th class="col-lang sortable" data-key="language" data-i18n="thLang">语言</th>
              <th class="col-desc" data-i18n="thDesc">简介</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr class="skeleton-row"><td colspan="6"><div class="skeleton"></div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <!-- 👇 新增：底部分类抽屉 & 遮罩层 -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="drawer" id="category-drawer">
    <div class="drawer-header">
      <h3 data-i18n="allCatsTitle">全部分类</h3>
      <button class="drawer-close" id="close-drawer-btn">✕</button>
    </div>
    <div class="drawer-content" id="drawer-content">
      <!-- JS 动态渲染折叠菜单 -->
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
