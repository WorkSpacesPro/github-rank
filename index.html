<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub 开源排行榜</title>
  
  <!-- 👇 SEO 与分享卡片优化 (发微信/推特自动出图) -->
  <meta name="description" content="自动追踪 GitHub 全站及各语言、框架的 Star 排行榜，实时计算涨星趋势。">
  <meta property="og:title" content="GitHub 开源排行榜">
  <meta property="og:description" content="每日自动同步，追踪最火的开源项目。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/logo.png">

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body>

  <div id="app-header"></div>

  <div class="layout">
    <div id="app-sidebar"></div>

    <main class="main">
      <h1 class="page-title">GitHub 开源排行榜</h1>
      <div class="page-meta" id="update-time">正在获取数据...</div>

      <!-- 👇 新增：前端搜索框 -->
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search-input" placeholder="搜索项目名、语言或简介...">
      </div>

      <div class="tabs" id="tabs"></div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th class="col-rank">#</th>
              <th>项目</th>
              <!-- 👇 加了 sortable 类名，点击可排序 -->
              <th class="col-stars sortable" data-key="stars">Stars</th>
              <th class="col-growth sortable" data-key="growth">涨星</th>
              <th class="col-lang sortable" data-key="language">语言</th>
              <th class="col-desc">简介</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- 加载时显示骨架屏 -->
            <tr class="skeleton-row"><td colspan="6"><div class="skeleton"></div></td></tr>
            <tr class="skeleton-row"><td colspan="6"><div class="skeleton"></div></td></tr>
            <tr class="skeleton-row"><td colspan="6"><div class="skeleton"></div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script src="assets/app.js"></script>
</body>
</html>
